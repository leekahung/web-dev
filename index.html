<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ka Hung Lee — Frontend Engineer Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Ka Hung Lee, a US-based Frontend Engineer specializing in React, TypeScript, and accessible web applications for civic-tech and data-heavy projects."
    />
    <meta name="author" content="Ka Hung Lee" />
    <link rel="canonical" href="https://leekahung.github.io/web-dev/" />
    <meta name="theme-color" content="#1e293b" />
    <!-- Apply saved light theme before first paint to avoid a dark flash -->
    <script>
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.classList.remove("dark");
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#e2e8f0");
        }
      } catch {}
    </script>

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Ka Hung Lee — Frontend Engineer Portfolio"
    />
    <meta
      property="og:description"
      content="US-based Frontend Engineer specializing in React, TypeScript, and accessible web applications for civic-tech and data-heavy projects."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://leekahung.github.io/web-dev/" />
    <meta property="og:site_name" content="Ka Hung Lee Portfolio" />
    <meta
      property="og:image"
      content="https://leekahung.github.io/web-dev/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Ka Hung Lee's portfolio homepage with a starry night background"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Ka Hung Lee — Frontend Engineer Portfolio"
    />
    <meta
      name="twitter:description"
      content="US-based Frontend Engineer specializing in React, TypeScript, and accessible web applications."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
